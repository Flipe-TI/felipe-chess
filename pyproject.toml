[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "felipe-chess"
version = "0.0.1"
description = "Motor de xadrez que joga como o Felipe (behavior cloning). Ver BRAINSTORM.md."
requires-python = ">=3.11"
dependencies = ["numpy==2.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
